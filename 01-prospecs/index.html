<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로스펙스</title>
    <link rel="shortcut icon" href="./images/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="reset.css">
    <style>
        body, html {
            background-color:#111;
            scroll-behavior: smooth;
        }
        /* Firefox */
        html {scrollbar-width: 10px;;scrollbar-color: #eee #222;}
        /* Opera */
        html::-o-scrollbar {width: 10px;}
        html::-o-scrollbar-thumb {background-color: #222;border-radius: 5px;}
        /* Chrome, Safari, Edge 등 웹킷 기반 브라우저 */
        ::-webkit-scrollbar {width: 10px;}
        ::-webkit-scrollbar-track {box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);}
        ::-webkit-scrollbar-thumb {background-color: #222;border-radius: 5px;}
        #top_btn {
            width:50px; line-height:50px; display:block; font-size:0.75rem;
            border-radius:50%; text-align:center;
            position:fixed; right:50px; bottom:50px; z-index:999;
            background:#000; color:#fff;
            box-shadow:0 0 10px rgba(255,255,255,0.25);
        }
        /* header, main, footer, nav를 그룹으로 묶어서 각각 최소너비제한, 1000px 이하로 작아지지 못하도록 함. */
        header,main,footer,nav {min-width:1000px;}
        header {text-align:center; padding:15px 0;}
        header img {width:80px;}
        nav {
            width:100%; margin:0 auto; background:#222;
            display:flex; justify-content:space-around; /* 양끝에 여백을 만듦 */
            /* 스크롤 내릴 시 네비 고정 css */
            position: sticky; top: 0; z-index: 900;
        }
        nav a {position:relative; display:inline-block; line-height:60px; padding:0 20px; color:#fff; font-size:0.875rem;}
        nav a::after {
            /* after을 만들어 활성화 되었을 때 글자 및 바의 디자인 (a의 마지막 요소 위치에 가상요소 생성) */
            display:block; /* after 디지안 시 보이도록 하기 위해 */ position:absolute; content:''; background:#e73b3b; width:100%; height:1px; bottom:1px; left:0; display:none;
            /* diaplay 속성이 2개 있을 때 마지막에 적용한 display만 적용 */
        } 
        nav a:hover {color:#e73b3b;} /* nav a 마우스를 올렸을 때 글자 색상이 바뀌도록 설정  */
        nav a:hover::after {display:block;} /* nav a에 마우스를 올렸을 때 after의 설정이 보이도록 설정 */
        main {}
        main section {
            height:100vh; /* 뷰포트 높이 (사용자가 보는 화면의 높이) */
            background-size:cover;
            background-position:center;
            position:relative;
            /* background의 이미지 사이즈와 포지션은 동일하기 때문에 전체에 사용함. */
        }
        /* 각각 섹션에 들어가는 이미지가 다르기 때문임. */
        main section:nth-child(1) {background-image:url(images/optimize1.png);}
        main section:nth-child(2) {
            /* 스크롤이 움직일 때 배경이미지가 고정되도록 함. css */
            background-attachment: fixed;
            background-image:url(https://images.unsplash.com/photo-1566932769119-7a1fb6d7ce23?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
        }
        main section:nth-child(3) {background-image:url(https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);}
        main section h2 {
            /* 부모높이vh에 들어간 값에 의해 부모가 길이가 매번 달라질 때 글자를 항상 왼쪽 아래 고정 설정을 위해 position:absolute로 사용 */
            position:absolute; left:50px; bottom:50px;
            font-size:3rem; font-weight:700; line-height:1.3; color:#fff;
        }
        footer {font-size:0.875rem; color:#aaa; text-align:center; padding:50px 0;}
    </style>
</head>
<body>
    <a href="#new" id="top_btn">TOP</a>
    <!-- 위 top버튼(cta) 클릭 시 section 2번 위치로 이동하기 -->
    <header>
        <h1><img src="images/logo.svg" alt="프로스펙스"></h1>
    </header>
    <nav>
        <a href="#hero">SHOP</a>
        <a href="#event">EVENT</a>
        <a href="#">ARCHIVE</a>
        <a href="#">SPONSORSHIP</a>
        <a href="#">SMART FIT</a>
    </nav>
    <main>
        <section id="hero"></section>
        <section id="new"><h2>새로워진<br>퍼포먼스 라인을 만나다</h2></section>
        <section id="event"><h2>시선을 사로잡는<br>오리지널 스포츠 클럽</h2></section>
    </main>
    <footer>COPYRIGHT &copy; LS NETWORKS CO. ALL RIGHTS RESERVED
    </footer>
</body>
</html>
