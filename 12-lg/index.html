<!DOCTYPE html>
<html lang="ko">
<head>
    <title>2020 DREAM PLAY</title>
    <meta charset="UTF-8">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="reset.css">
    <style>
        body {background:#000;}
        body * {/* border:1px solid aqua; */}
        header {
            padding:20px 0; width:1400px; margin:0 auto;
            display:flex; justify-content:space-between; align-items:center;
        }
        main {
            min-width:1400px; margin:0 auto;
            background:url(images/bg_intro.jpg) center;
            background-size:cover;
            height:100vh;
        }
        main .center {
            display:flex; 
            justify-content:center; align-items:center;
            height:100vh;
        }
        main .video_bg {
            width:790px; height:640px; position:relative;
            overflow:hidden; z-index: 40;
        }
        main .video_bg video {
            position:absolute;
            left:-100px; top:-200px; z-index:10;
        }
        main .video_bg img {
            position:absolute; 
            left:0; top:0; z-index:20;
            width:100%;
        }
        main .txt_bg_ani {
            background:url(images/bg_flow.png) repeat-x left center;
            height:640px; width:100%;
            position:absolute; z-index:15; /* z-index가 비디오엔 없기 때문에 추가해서 중첩 순서를 정해줌.*/
            animation: txtBgAni 60s infinite linear;
        }
        /* 애니메이션 */
        @keyframes txtBgAni {
            0% {background-position:0;}
            100% {background-position:5000px;}
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="#"><img src="images/logo.jpg" alt=""></a></h1>
        <nav><a href="#"><img src="images/nav.jpg" alt=""></a></nav>
    </header>
    <main>
        <div class="center">
            <div class="video_bg">
                <video src="video/golden.mp4" autoplay muted loop></video>
                <img src="images/img_intro.png" alt="">
                <div class="txt_bg_ani"></div>
                <!-- 형제로 묶어야 하는 이유: 부모 위치가 있을 때 첫째와 둘째 형제가 겹친 상태로 만들어야 하기 때문임. -->
            </div>
        </div>
    </main>
</body>
</html>
